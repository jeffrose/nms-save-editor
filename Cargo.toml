[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeffrose/nms-save-editor"
authors = ["jeffrose"]

[workspace.dependencies]
nms-format = { path = "crates/nms-format" }
nms-model = { path = "crates/nms-model" }
lz4_flex = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
