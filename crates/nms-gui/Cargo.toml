[package]
name = "nms-gui"
description = "Desktop editor for No Man's Sky save files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nmsedit-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
nms-data.workspace = true
nms-edit.workspace = true
nms-format.workspace = true
nms-model.workspace = true
